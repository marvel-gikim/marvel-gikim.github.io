name: Notify subscribers about new articles

on:
  push:
    branches: [main]
    paths:
      - 'docs/articles.json'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the OneSignal key is set (does not print it)
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          if [ -n "$ONESIGNAL_REST_API_KEY" ]; then echo "ONESIGNAL_REST_API_KEY: set"; else echo "ONESIGNAL_REST_API_KEY: MISSING"; fi
      - name: Delivery report of recent notifications (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/push_report.py
      - name: Send push for new articles
        if: github.event_name == 'push'
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          BEFORE: ${{ github.event.before }}
        run: python scripts/notify_new_articles.py
