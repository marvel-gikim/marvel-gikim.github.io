name: Notify subscribers about new articles

on:
  push:
    branches: [main]
    paths:
      - 'docs/articles.json'
  workflow_dispatch:
    inputs:
      announce_id:
        description: "Article id: send now the 'saved for later' heads-up for this locked article"
        required: false
        default: ""
      test_subscription_id:
        description: "Device id from #push-check: send a test notification to that device only"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the OneSignal key is set (does not print it)
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          if [ -n "$ONESIGNAL_REST_API_KEY" ]; then echo "ONESIGNAL_REST_API_KEY: set"; else echo "ONESIGNAL_REST_API_KEY: MISSING"; fi
      - name: Delivery report of recent notifications (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/push_report.py
      - name: Heads-up for a locked article (manual runs with announce_id)
        if: github.event_name == 'workflow_dispatch' && inputs.announce_id != ''
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ANNOUNCE_ID: ${{ inputs.announce_id }}
        run: python scripts/notify_new_articles.py
      - name: Test notification to one device (manual runs with test_subscription_id)
        if: github.event_name == 'workflow_dispatch' && inputs.test_subscription_id != ''
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          TEST_SUBSCRIPTION_ID: ${{ inputs.test_subscription_id }}
        run: python scripts/notify_new_articles.py
      - name: Send push for new articles
        if: github.event_name == 'push'
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          BEFORE: ${{ github.event.before }}
        run: python scripts/notify_new_articles.py
