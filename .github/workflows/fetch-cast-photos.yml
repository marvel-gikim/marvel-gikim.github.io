name: Fetch cast photos (Wikimedia Commons)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cast.json'
      - 'scripts/fetch_cast_photos.py'
      - '.github/workflows/fetch-cast-photos.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/fetch_cast_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cast public/cast
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add cast photos from Wikimedia Commons"
          git push
